name: build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, "all", or empty for everything not published yet'
        type: string
        default: ''
      skip_publish:
        description: 'Build only; do not touch R2'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile'
      - 'scripts/build.sh'
      - 'scripts/build-in-container.sh'
      - 'scripts/makepkg-each.sh'
      - 'scripts/fetch-patch-set.sh'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick packages
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          case "${PACKAGES}" in
            '')  list="$(./scripts/unpublished-packages.sh)" ;;
            all) list="$(git ls-files 'packages/*/PKGBUILD' | xargs -rn1 dirname | xargs -rn1 basename)" ;;
            *)   list="$(tr -s ' ' '\n' <<< "${PACKAGES}")" ;;
          esac
          json="$(jq -Rnc '[inputs | select(length > 0)]' <<< "${list}")"
          echo "==> ${json}"
          echo "packages=${json}" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, plan]
    if: ${{ needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Restore builder image
        id: imgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load or build the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            docker build -t linux-handheld-builder:latest .
            mkdir -p ~/.cache
            docker save linux-handheld-builder:latest -o ~/.cache/builder-image.tar
          fi

      - name: Save builder image
        if: ${{ !cancelled() && steps.imgcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.package }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.package }}-

      - name: Build
        env:
          PKG: ${{ matrix.package }}
        run: ./scripts/build.sh "${PKG}"

      - name: Save ccache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.package }}-${{ github.sha }}

      - name: Bundle packages
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          (cd out && tar -cf "../packages-${PKG}.tar" ./*.pkg.tar.zst)

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.package }}
          path: packages-${{ matrix.package }}.tar
          retention-days: 14

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dl
          merge-multiple: true

      - name: Unpack packages
        run: |
          set -euo pipefail
          mkdir -p out
          for t in dl/*.tar; do
            [ -e "${t}" ] || continue
            tar -xf "${t}" -C out
          done

      - name: Job summary
        run: |
          set -euo pipefail
          if compgen -G 'out/*.pkg.tar.zst' > /dev/null; then
            {
              echo "### Packages built"
              echo
              echo "| package | size |"
              echo "|---|---|"
              for f in out/*.pkg.tar.zst; do
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing was built." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Restore builder image
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load or build the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            docker build -t linux-handheld-builder:latest .
          fi

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools unzip

          RCLONE_VER=v1.75.0
          RCLONE_SHA=d0ad88ba4c8e285b7c9efa591e0ab643280a91741e13c27f3a9c0957ccfa5203
          curl -fsSL --retry 3 -o /tmp/rclone.zip \
            "https://github.com/rclone/rclone/releases/download/${RCLONE_VER}/rclone-${RCLONE_VER}-linux-arm64.zip"
          echo "${RCLONE_SHA}  /tmp/rclone.zip" | sha256sum -c -
          unzip -q -j /tmp/rclone.zip "*/rclone" -d /tmp
          sudo install -m755 /tmp/rclone /usr/local/bin/rclone
          rclone version | sed -n 1p

      - name: Publish to R2
        if: ${{ !inputs.skip_publish }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.REPO_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          if compgen -G 'out/*.pkg.tar.zst' > /dev/null; then
            ./scripts/publish-r2.sh
          else
            echo "nothing built; not touching the database"
          fi

  report:
    needs: [build, publish]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./scripts/report-failure.sh
