name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
          done
          echo "$(ls scripts/*.sh | wc -l) scripts parse"

      # shellcheck is
      - name: Shellcheck
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            -e SC1090,SC1091,SC2086,SC2016,SC2181,SC2012,SC2154 scripts/*.sh
          echo "shellcheck v0.11.0: clean"

      - name: Workflows
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml 2>/dev/null || true
          python3 scripts/lint-workflows.py

      - name: PKGBUILDs parse
        run: |
          set -euo pipefail
          n=0
          for p in packages/*/PKGBUILD; do
            bash -n "$p" || { echo "::error file=$p::bash syntax error"; exit 1; }
            n=$((n + 1))
          done
          for i in packages/*/*.install; do
            [ -e "$i" ] || continue
            bash -n "$i" || { echo "::error file=$i::bash syntax error"; exit 1; }
          done
          echo "$n PKGBUILDs parse"

      - name: Rebuilds get a new filename
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "no usable base commit (${BASE:-none}) -- nothing to compare"
            exit 0
          fi

          version_of() {
            ( set +eu; pkgver=; pkgrel=; . "$1" >/dev/null 2>&1 || true
              printf '%s-%s' "${pkgver}" "${pkgrel}" )
          }

          rc=0
          for d in packages/*/; do
            p="$(basename "${d}")"
            [ -f "${d}PKGBUILD" ] || continue
            git cat-file -e "${BASE}:${d}PKGBUILD" 2>/dev/null || continue
            git diff --quiet "${BASE}" HEAD -- "${d}" \
              ":(exclude)${d}upstream.env" ":(exclude)${d}README.md" && continue

            git show "${BASE}:${d}PKGBUILD" > "${RUNNER_TEMP}/PKGBUILD.base"
            was="$(version_of "${RUNNER_TEMP}/PKGBUILD.base")"
            now="$(version_of "${d}PKGBUILD")"
            if [ "${was}" = "${now}" ]; then
              echo "::error file=${d}PKGBUILD::${p} changed but is still ${now} -- bump pkgrel, or the rebuild republishes a filename that is already live"
              rc=1
            else
              echo "ok   ${p}: ${was} -> ${now}"
            fi
          done
          [ "${rc}" = 0 ] || exit 1
          echo "every changed package has a version of its own"

      - name: Package manifests
        run: |
          set -euo pipefail
          rc=0

          grep -qE '^REPO_NAME=[a-z0-9-]+$' repo.env \
            || { echo "::error file=repo.env::REPO_NAME missing or not a plain repo name"; rc=1; }
          grep -qE '^ARCH_DIR=[a-z0-9/-]+$' repo.env \
            || { echo "::error file=repo.env::ARCH_DIR missing or malformed"; rc=1; }

          for d in packages/*/; do
            p="$(basename "$d")"

            [ -f "${d}PKGBUILD" ] \
              || { echo "::error::packages/${p} has no PKGBUILD"; rc=1; continue; }
            [ -f "${d}upstream.env" ] \
              || { echo "::error::packages/${p} has no upstream.env -- the poller would ignore it"; rc=1; continue; }

            # shellcheck disable=SC1090
            ( TRACK=; GITHUB_REPO=; GIT_URL=; OCI_IMAGE=; OCI_TAG_RE=; AUR_PKG=; CURRENT=; TRACK_PATHS=
              . "${d}upstream.env"
              case "${TRACK}" in
                none) ;;
                oci)
                  [ -n "${OCI_IMAGE}" ] && [ -n "${CURRENT}" ] \
                    || { echo "::error::packages/${p}: TRACK=oci needs OCI_IMAGE and CURRENT"; exit 1; }
                  [ -n "${OCI_TAG_RE}" ] && [[ "${CURRENT}" =~ ${OCI_TAG_RE} ]] \
                    || { echo "::error::packages/${p}: CURRENT does not match its own OCI_TAG_RE"; exit 1; } ;;
                github-release)
                  [ -n "${GITHUB_REPO}" ] && [ -n "${CURRENT}" ] \
                    || { echo "::error::packages/${p}: TRACK=github-release needs GITHUB_REPO and CURRENT"; exit 1; } ;;
                github-paths)
                  [ -n "${GITHUB_REPO}" ] && [ -n "${TRACK_PATHS}" ] && [ -n "${CURRENT}" ] \
                    || { echo "::error::packages/${p}: TRACK=github-paths needs GITHUB_REPO, TRACK_PATHS and CURRENT"; exit 1; }
                  [[ "${CURRENT}" =~ ^[0-9a-f]{40}$ ]] \
                    || { echo "::error::packages/${p}: TRACK=github-paths needs a full 40-char commit sha in CURRENT, got '${CURRENT}'"; exit 1; } ;;
                git-tag)
                  [ -n "${GIT_URL}" ] && [ -n "${CURRENT}" ] \
                    || { echo "::error::packages/${p}: TRACK=git-tag needs GIT_URL and CURRENT"; exit 1; } ;;
                aur)
                  [ -n "${AUR_PKG}" ] && [ -n "${CURRENT}" ] \
                    || { echo "::error::packages/${p}: TRACK=aur needs AUR_PKG and CURRENT"; exit 1; } ;;
                *)
                  echo "::error::packages/${p}: unknown TRACK='${TRACK}'"; exit 1 ;;
              esac ) || rc=1
          done

          [ "$rc" = 0 ] && echo "repo.env and all $(ls -d packages/*/ | wc -l) package manifests look sane"
          exit "$rc"
