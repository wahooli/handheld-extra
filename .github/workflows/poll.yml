name: poll upstreams

# Checks every package against its declared upstream and reports what is behind.
#
# When something is behind, it bumps it, commits, and dispatches a build. The
# build workflow already opens an issue if that build fails, so failure has one
# home rather than two.
#
# What made this safe was giving each package a declaration of how its version is
# derived -- upstream tag through a sed, armada's BASE.env, or armada's published
# OCI tag -- instead of assuming one rule fits all. A package that cannot be
# bumped mechanically says so: hyprgrass sets AUTOBUMP=no because its pkgver is
# composed with a pinned Hyprland version, and taking a new release without
# checking which Hyprland the image ships builds a plugin for the wrong ABI.
#
# That declaration covers a second axis too: an ABI PIN, the exact version of
# ANOTHER package a build is compiled against. hyprgrass pins hyprland, and ALARM
# moving hyprland strands every device -- `pacman -Syu` refuses the whole
# transaction, so nothing on the system upgrades. That axis is auto-bumped and
# built, on ALARM's schedule rather than upstream's, which is why this poll is
# the thing standing between a hyprland release and a stuck device.
#
# An issue is still raised here for a bump that FAILS -- a checksum that will not
# refresh, a PKGBUILD that stops parsing -- because no build will happen to
# report it.
on:
  schedule:
    # Daily rather than the kernel's 6-hourly. These upstreams release on the
    # order of weeks, and nothing here auto-builds, so a faster poll would only
    # rewrite the same issue more often.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write    # to commit the bumps
  actions: write     # to dispatch build.yml
  issues: write

concurrency:
  group: poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check upstreams and bump
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/poll-upstreams.sh --bump

      # Committed through the GraphQL API rather than `git commit && git push`,
      # because GitHub signs commits made with a bot token server-side. The bump
      # lands Verified and satisfies a "require signed commits" branch rule; a
      # plain push from the runner is unsigned and would be rejected. There is no
      # key to manage -- GITHUB_TOKEN being a bot token is the whole mechanism.
      #
      # expectedHeadOid makes this a compare-and-swap: if main moved between the
      # checkout and now the mutation fails, the run goes red, and tomorrow's
      # poll redoes the bump against the new head.
      #
      # The index is used purely to enumerate what changed -- `git add -A` then
      # --diff-filter, so renames and deletions are git's problem and not a
      # hand-rolled `git status` parse. Nothing is pushed with git.
      #
      # Runs for tracking-only updates too, not just bumps. When an upstream ref
      # moves without moving anything the package builds from, bump-package.sh
      # exits 3 and edits nothing but CURRENT. That still has to be committed --
      # otherwise every poll rediscovers it and reports it again forever -- while
      # the build below deliberately does NOT run for it. Rebuilding an unchanged
      # pkgver-pkgrel republishes a filename that is already live and served
      # immutable, which is how a device gets old bytes against a new signature.
      - name: Commit the bumps
        id: commit
        if: ${{ steps.poll.outputs.bumped != '0' || steps.poll.outputs.tracked != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not "${{ }}" inline: the list is built from upstream
          # version strings and has no business in a shell command.
          BUMPED: ${{ steps.poll.outputs.bumped_list }}
          TRACKED: ${{ steps.poll.outputs.tracked_list }}
        run: |
          set -euo pipefail
          oid="$(git rev-parse HEAD)"
          git add -A packages

          additions="$(git diff --cached --name-only --diff-filter=ACMR -- packages \
            | while IFS= read -r f; do
                jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" \
                  '{path: $path, contents: $contents}'
              done | jq -s '.')"
          deletions="$(git diff --cached --name-only --diff-filter=D -- packages \
            | jq -R '{path: .}' | jq -s '.')"

          # A reported change with an empty diff would mean the bump script said
          # it edited something it did not; an empty commit is not the way to
          # find that out.
          [ "$(jq 'length' <<<"$additions")" != "0" ] || [ "$(jq 'length' <<<"$deletions")" != "0" ] || {
            echo "!! ${BUMPED} ${TRACKED} reported as changed but nothing under packages/ changed" >&2
            exit 1
          }

          # "bump" and "track" are named separately in the subject because they
          # mean different things to anyone reading the log later: bumped
          # packages were rebuilt and republished, tracked ones only had CURRENT
          # updated and were deliberately not built.
          headline="chore(packages):"
          [ -n "${BUMPED}" ] && headline="${headline} bump ${BUMPED}"
          [ -n "${BUMPED}" ] && [ -n "${TRACKED}" ] && headline="${headline};"
          [ -n "${TRACKED}" ] && headline="${headline} track ${TRACKED}"

          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg oid "${oid}" \
            --arg headline "${headline}" \
            --argjson additions "${additions}" \
            --argjson deletions "${deletions}" \
            '{
               query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
               variables: { input: {
                 branch:          { repositoryNameWithOwner: $repo, branchName: $branch },
                 message:         { headline: $headline },
                 expectedHeadOid: $oid,
                 fileChanges:     { additions: $additions, deletions: $deletions }
               } }
             }' \
            | gh api graphql --input - \
                --jq '.data.createCommitOnBranch.commit.oid' > new-oid.txt
          echo "==> committed $(cut -c1-8 new-oid.txt)"
          echo "oid=$(cat new-oid.txt)" >> "$GITHUB_OUTPUT"

      # workflow_dispatch resolves `ref` server-side, and that read can lag the
      # commit that was just made through the API. It did: a gamescope bump was
      # committed at 12:58:39 and the dispatch two seconds later resolved `main`
      # to the commit BEFORE it, so CI built the previous pin, failed, and the
      # bump was never tested. The next poll then saw CURRENT already up to date
      # and dispatched nothing, so the package sat unbuilt for days.
      #
      # `ref` cannot be a sha -- the API takes a branch or tag name only -- so
      # the fix is to wait for the name to resolve to the sha we just wrote.
      - name: Wait for the branch to resolve to the new commit
        if: ${{ steps.commit.outputs.oid != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ steps.commit.outputs.oid }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for _ in $(seq 30); do
            have="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BRANCH}" --jq .sha 2>/dev/null || true)"
            [ "${have}" = "${WANT}" ] && { echo "==> ${BRANCH} is at ${WANT:0:8}"; exit 0; }
            sleep 2
          done
          # Not a failure: the dispatch below still runs, and the self-heal step
          # rebuilds anything that ends up unpublished. Saying so beats a red run.
          echo "::warning::${BRANCH} did not resolve to ${WANT:0:8} in 60s; the build may run against an older commit"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # build has to be dispatched explicitly. Documented GitHub behaviour, not
      # something a path filter can work around.
      #
      # The list is bumped-this-run UNION not-currently-published. The union is
      # the point: a bump whose build failed, raced, or never ran is invisible to
      # every other check here -- the poller's question is "is CURRENT behind
      # upstream", and after a bump the answer is no even though nothing was
      # ever built. Comparing against what the repo actually SERVES asks the only
      # question that survives an unknown failure mode, so a package heals on the
      # next poll whatever went wrong.
      #
      # Passing names matters. Without them `packages` defaults to `all`, and a
      # single bump rebuilds and republishes every package -- pointless builds
      # and a database rewritten for unchanged entries.
      - name: Build what was bumped or is missing
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPED: ${{ steps.poll.outputs.bumped_list }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fails closed: an unreachable repo exits non-zero and dispatches
          # nothing, rather than reading as "nothing is published" and rebuilding
          # everything.
          missing="$(./scripts/find-unpublished.sh || true)"
          targets="$(printf '%s %s' "${BUMPED}" "$(echo ${missing})" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | sed 's/ $//')"
          if [ -z "${targets}" ]; then
            echo "==> everything published matches this tree; nothing to build"
            exit 0
          fi
          echo "==> dispatching build for: ${targets}"
          gh workflow run build.yml --ref "${BRANCH}" -f packages="${targets}"

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -s .upstream-report.md ]; then
            cat .upstream-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Everything is up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only for what could NOT be bumped: AUTOBUMP=no packages needing a human,
      # and bumps that failed outright. Successful bumps need no issue -- they
      # produce a commit and a build, and the build reports its own failures.
      - name: Report what needs a human
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-upstream-issue.sh
